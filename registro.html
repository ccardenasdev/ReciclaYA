<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - EcoTrueque</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/formularios.css">
</head>
<body>

  <!-- ENCABEZADO Y MENÚ -->
  <header>
    <div class="logo">Eco<span>Trueque</span></div>

    <button class="menu-toggle" id="btnMenu">&#9776;</button>

    <nav>
      <ul id="listaMenu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="empresas.html">Empresas</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <section>
    <div class="contenedor-formulario">
      <h2>Crear cuenta</h2>

      <div class="mensaje-exito" id="mensajeExitoRegistro">
        ¡Cuenta creada con éxito!
      </div>

      <form id="formRegistro">
        <div class="opciones-tipo">
          <label><input type="radio" name="tipoCuenta" value="persona" checked> Persona natural</label>
          <label><input type="radio" name="tipoCuenta" value="empresa"> Empresa</label>
        </div>

        <div class="campo">
          <label for="nombreRegistro">Nombre completo</label>
          <input type="text" id="nombreRegistro" placeholder="Ej: María Gómez">
          <span class="error" id="errorNombreRegistro"></span>
        </div>

        <div class="campo">
          <label for="correoRegistro">Correo electrónico</label>
          <input type="email" id="correoRegistro" placeholder="correo@ejemplo.com">
          <span class="error" id="errorCorreoRegistro"></span>
        </div>

        <div class="campo">
          <label for="claveRegistro">Contraseña</label>
          <input type="password" id="claveRegistro" placeholder="Mínimo 6 caracteres">
          <span class="error" id="errorClaveRegistro"></span>
        </div>

        <button type="submit" class="btn">Registrarme</button>
      </form>

      <p class="enlace-secundario">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
      </p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 EcoTrueque - Proyecto académico de compra y venta de reciclaje</p>
  </footer>

  <script src="js/menu.js"></script>
  <script src="js/validar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - EcoTrueque</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/formularios.css">
</head>
<body>

  <!-- ENCABEZADO Y MENÚ -->
  <header>
    <div class="logo">Eco<span>Trueque</span></div>

    <button class="menu-toggle" id="btnMenu">&#9776;</button>

    <nav>
      <ul id="listaMenu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="empresas.html">Empresas</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <section>
    <div class="contenedor-formulario">
      <h2>Iniciar sesión</h2>

      <div class="mensaje-exito" id="mensajeExitoLogin">
        ¡Bienvenido de nuevo!
      </div>

      <form id="formLogin">
        <div class="campo">
          <label for="correoLogin">Correo electrónico</label>
          <input type="email" id="correoLogin" placeholder="correo@ejemplo.com">
          <span class="error" id="errorCorreoLogin"></span>
        </div>

        <div class="campo">
          <label for="claveLogin">Contraseña</label>
          <input type="password" id="claveLogin" placeholder="Tu contraseña">
          <span class="error" id="errorClaveLogin"></span>
        </div>

        <button type="submit" class="btn">Ingresar</button>
      </form>

      <p class="enlace-secundario">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 EcoTrueque - Proyecto académico de compra y venta de reciclaje</p>
  </footer>

  <script src="js/menu.js"></script>
  <script src="js/validar.js"></script>
</body>
</html>
